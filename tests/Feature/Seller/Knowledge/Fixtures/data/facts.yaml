    - "работаем круглый год без выходных: будни 10–20, выходные 10–18"
  bridge_hint: "спросить, из какого города клиент"
- id: company_about
  topic: company
  facts:
    - "«Союз Пир» — оптовый поставщик пиротехники, мультибрендовый склад"
    - "больше 15 торговых марок и больше 2500 позиций"
    - "своя эксклюзивная линейка Zerga, которой больше ни у кого нет"
  must_not: ["расписывать все бренды списком, если не спросили"]
  bridge_hint: "вернуться к тому, что клиент ищет"
- id: brands_list
