# ---------- Прайс и ассортимент ----------
- id: price_list_how_to_send
  topic: price_list
  facts:
    - "прайс отправляем на почту и дублируем в мессенджер (Макс, WhatsApp или Telegram), чтобы контакт был"
    - "пишем с другого, рабочего номера — предупреждаем, чтобы не пугались"
  bridge_hint: "спросить почту; затем какой мессенджер на номере"
  tool_hint: send_price
- id: price_list_format
  topic: price_list
  facts:
    - "прайс — Excel-таблица, по сути каталог, больше 1500 строк"
    - "по каждой позиции: название, калибр и залпы, минимальная единица отгрузки, цена за единицу, базовая цена и цена с вашей скидкой"
    - "в правых колонках ссылки на видео эффекта; удобнее смотреть с компьютера"
    - "файл сохранить в папку и открыть оттуда — тогда в жёлтом поле ставите количество, сумма считается сама"
  bridge_hint: "спросить, на какую почту отправить"
- id: discount_in_price
  topic: price_list
  facts:
    - "в прайсе две колонки: базовая оптовая цена и цена уже с вашей скидкой"
    - "ориентир — колонка со скидкой, это конечная цена; сверху только доставка ТК до города"
- id: price_list_photos
  topic: price_list
  facts:
    - "прайс без картинок — позиций больше 1500, с фото файл не откроется"
    - "вместо фото по каждой позиции ссылка на видео эффекта"
    - "по Zerga можем отдельно скинуть фото коробок"
    - "сайта-каталога с ценами нет — каталог и есть прайс"
  must_not: ["оправдываться", "обещать сделать прайс с картинками"]
  bridge_hint: "предложить видео по Zerga и подборку; спросить мессенджер"
- id: videos
  topic: price_list
  facts:
    - "по большинству позиций в прайсе ссылка на видео залпа"
    - "по Zerga пришлём отдельно подборку видео"
- id: stock_availability
  topic: price_list
  facts:
    - "в прайсе то, что есть на складе на момент выгрузки; остатки меняются быстро, особенно в сезон"
    - "перед заказом лучше запросить свежий прайс; если позиция закончилась — предложим замену"
    - "наличие конкретной позиции прямо сейчас агент не видит — уточняет у коллег"
  must_not: ["утверждать наличие конкретной позиции"]
  tool_hint: check_stock
- id: novelties
  topic: assortment
  facts:
    - "новинки сезона: новые позиции Zerga (веера, сотки, корсары), гендерные салюты для гендер-пати (мальчик/девочка, дневные дымовые), новые петарды Волк"
    - "контейнеры приходят осенью; как придут — обновим прайс"
- id: assortment_firecrackers
  topic: assortment
  facts:
    - "петарды в прайсе отдельным блоком: Корсары 1–8, Волк (Демон, Халк) — самые мощные"
    - "крупные петарды (Корсар 5 и больше) в этом году в дефиците — брать заранее"
- id: assortment_small
  topic: assortment
  facts:
    - "вся мелочь есть: бенгальские разной длины, хлопушки, фонтаны, цветной дым, ракеты, римские свечи"
    - "в прайсе фонтаны вверху, бенгальские внизу"
- id: assortment_big
  topic: assortment
  facts:
    - "батареи от 16 до 300 залпов, веерные, модульные"
    - "для розницы основа — 16–49 залпов, это 80% продаж; крупные — несколько штук для витрины"
- id: box_qty
  topic: assortment
  facts:
    - "в коробке: мелкие батареи 12–24 шт., средние 4–8, большие на 49 залпов 2–4, сотки и модульные — по 1"
    - "количество в транспортной коробке указано в прайсе"
- id: by_piece
  topic: assortment
  facts:
    - "батареи отгружаем поштучно, петарды и мелочь — блоками (минимальная единица в прайсе)"
    - "коробками дешевле — на коробочные позиции скидка выше"
- id: promo_materials
  topic: assortment
  facts:
    - "бесплатно с заказом: плакаты, каталоги, фото- и видеоматериалы"
    - "на батареях QR-код — покупатель смотрит видео со смартфона; видео можно крутить на телевизоре в магазине"

# ---------- Zerga ----------
- id: zerga_about
  topic: zerga
  facts:
    - "Zerga — наша эксклюзивная премиум-линейка, продаётся только у нас"
    - "качество уровня Русского фейерверка, цена ниже; плотный картон, стильные коробки, сроки годности до 2030–2032"
    - "повышенная скидка коробками ({cond:box_discounts.zerga}%)"
    - "контролируем розничную цену на маркетплейсах — карточки ниже рекомендованной цены блокируем, розницу не перебьют"
    - "кто взял раз — возвращаются"
  bridge_hint: "предложить 1–2 коробки на пробу и видео"
- id: zerga_unknown_objection
  topic: zerga
  facts:
    - "в рознице покупатель берёт не бренд, а эффект за свои деньги: видит видео, коробку и цену"
    - "по эффекту Zerga сопоставима с РФ, по цене ниже — за РФ платят за бренд"
    - "попробовать 1–2 коробки; по статистике клиентов за Zerga возвращаются"
- id: zerga_corsairs
  topic: zerga
  facts:
    - "корсары Zerga 1–4 дешевле аналогов РФ и мощнее — «второй стреляет как третий», оформление ярче"

# ---------- Цены, скидки, минималка ----------
- id: min_order
  topic: pricing
  facts:
    - "опт начинается от {cond:min_order_rub} руб.; не в сезон — от {cond:offseason_min_order_rub}"
    - "к объёму не привязываем: дозаказ потом хоть на 10 тысяч, скидка сохраняется"
  must_not: ["называть другую минималку"]
- id: discount_grid
  topic: pricing
  facts:
    - "прайс — базовая оптовая цена, скидка зависит от объёма: {cond:discount_grid}"
    - "коробками Zerga/Волк/Премьер Салют — {cond:box_discounts}"
    - "новым клиентам согласовываем чуть больше сетки"
  must_not: ["называть процент выше утверждённого", "обещать скидку за наличные"]
  bridge_hint: "спросить ориентир суммы вилкой, объяснив, что это для скидки и ни к чему не обязывает"
- id: discount_not_tied
  topic: pricing
  facts:
    - "скидку согласовываем под потенциальный объём, и она сохраняется на любую сумму и на дозаказы"
    - "возьмёте меньше, чем планировали — скидка не слетит"
- id: box_discounts
  topic: pricing
  facts:
    - "на транспортные коробки скидка выше: отдельные коробочные прайсы по Zerga, Волк, Премьер Салют"
    - "если позиция есть и в общем, и в коробочном прайсе — выгоднее коробкой"
    - "из-за разных скидок россыпь и коробки оформляются двумя накладными, сумма та же"
- id: discount_vs_competitors
  topic: pricing
  facts:
    - "честно: 50–60% мы не дадим; проценты считаются от разных базовых цен, мы базу не задираем, чтобы потом дарить скидку"
    - "сравнивать надо итоговую цену на трёх конкретных позициях: дешёвая, средняя, крупная (например батарея 0,8 дюйма на 16 залпов)"
    - "по Zerga цена не бьётся ни с кем — она только у нас"
  must_not: ["обещать догнать чужую скидку", "ругать конкурента"]
- id: promotions_now
  topic: pricing
  facts:
    - "акции сейчас: {cond:promotions}"
  must_not: ["называть сроки акции, которых нет в conditions"]
- id: cash_discount
  topic: pricing
  facts:
    - "способ оплаты на цену не влияет"
    - "крупные суммы и особые условия — обсуждаются с руководителем, агент сам не обещает"
  must_not: ["называть скидку за наличные"]
- id: markup_advice
  topic: pricing
  facts:
    - "средняя наценка в рознице ×2–3: мелочь (бенгальские, хлопушки, петарды) 250–300%, средние батареи в два конца, крупные 50–100%"
    - "сходить в ближайшую физическую точку и сравнить три позиции — дешёвую, среднюю, дорогую; на интернет не ориентироваться, там демпинг"
    - "пиротехника — спонтанная покупка: за 100 рублей разницы через город не поедут; если конкурентов рядом нет — наценка выше"

# ---------- Подорожание, дефицит, сезон ----------
- id: price_increase
  topic: timing
  facts:
    - "каждый год в октябре–ноябре производители поднимают цены на {cond:price_increase_forecast.pct_min}–{cond:price_increase_forecast.pct_max}%; {cond:price_increase_forecast.leader_brand} уже вошёл с ценами следующего года, остальные подтянутся"
    - "{cond:price_increase_forecast.example}"
  bridge_hint: "спросить, закупка сейчас или ближе к сезону"
- id: best_time_to_buy
  topic: timing
  facts:
    - "оптимально сентябрь–октябрь: до подорожания, пока есть выбор и ТК не перегружены"
    - "в декабре дороже, часть позиций заканчивается, доставка дольше"
- id: shortage
  topic: timing
  facts:
    - "весной остановились крупные фабрики в Китае после пожара, импортёры завезли около 30% плана"
    - "крупных петард дефицит после аварии на российском производстве"
    - "кто берёт заранее — получит, в декабре может не быть"
- id: too_early_response
  topic: timing
  facts:
    - "понимаем, что торговать рано; но с каждым месяцем дороже, акции до {cond:promotions.0.until}"
    - "можно набрать заказ и поставить на резерв: цены зафиксированы, оплата позже"
    - "можно договориться, когда обновить прайс — например в середине октября"
  bridge_hint: "спросить, когда прислать свежий прайс (предложить два варианта)"
- id: last_season
  topic: timing
  facts:
    - "по регионам по-разному, но большинство клиентов жалели, что взяли мало — к 28–31 декабря полки пустые"
    - "80% продаж — последняя неделя года"
- id: other_seasons
  topic: timing
  facts:
    - "летом свадьбы и выпускные (фонтаны, холодные), гендер-пати (дневные дымовые салюты), 9 Мая, День города"
    - "охотники и сельские берут Корсары 5–6 от медведей; выпал снег — люди идут за петардами"
- id: reserve_fix_price
  topic: timing
  facts:
    - "набираете заказ — ставим на резерв, фиксируем позиции и цены (ориентир {cond:reserve_days} дней)"
    - "оплатить можно позже или частями"
- id: pay_now_take_later
  topic: timing
  facts:
    - "оплатили сейчас — цена зафиксирована, храним на складе до отгрузки"
    - "дозаказ потом по действующему прайсу, скидка сохраняется"

# ---------- Доставка ----------
- id: delivery_tk
  topic: delivery
  facts:
    - "отправляем транспортными компаниями: в основном КИТ (на 15–20% дешевле Деловых, есть договорённости по пиротехнике), также Деловые Линии, ЖелДорЭкспедиция, Байкал-Сервис, Возовоз"
    - "до терминала ТК в Москве довозим бесплатно; дальше оплачивает клиент при получении либо включаем в счёт"
  bridge_hint: "спросить город, чтобы прикинуть доставку"
  tool_hint: calc_delivery
- id: delivery_cost
  topic: delivery
  facts:
    - "зависит от веса и города; ориентиры по нашим отгрузкам: 250 тыс. в Воронеж около 2000 руб., 50 тыс. в Вологду около 3000, 100 тыс. в Новосибирск 5–6 тыс., 500 тыс. в Нижний около 10 тыс."
    - "коробка весит около 10 кг"
    - "точную сумму считаем на сайте ТК и отписываем в мессенджер"
  must_not: ["называть точную стоимость без расчёта"]
  bridge_hint: "спросить город / мессенджер, куда прислать расчёт"
  tool_hint: calc_delivery
- id: delivery_time
  topic: delivery
  facts:
    - "центральная Россия 2–5 дней, Краснодар до недели, Новосибирск около 7, Якутия 7–10, дальние регионы до 3 недель"
    - "в декабре ТК перегружены — закладывать запас"
- id: delivery_address
  topic: delivery
  facts:
    - "можно до терминала ТК в городе клиента или адресно до точки — адресная дороже, сумму считает ТК"
    - "если в городе нет КИТа — смотрим ближайший терминал, другую ТК или адресную доставку"
  must_not: ["называть цену адресной доставки"]
- id: delivery_moscow
  topic: delivery
  facts:
    - "по Москве и области — самовывоз со склада на ВДНХ или до нужного терминала ТК бесплатно"
    - "адресная доставка по Москве — уточнить у менеджера"
- id: sdek
  topic: delivery
  facts:
    - "СДЭК не подходит: пиротехнику формально не возит, вскрывает коробки и выходит дорого — маленький фонтан обошёлся в 560 руб."
    - "отправляем КИТом или другой ТК"
- id: pickup
  topic: delivery
  facts:
    - "самовывоз приветствуется — так даже быстрее; заказ набрать заранее, соберём, приедете и заберёте"
    - "оплатить можно на месте, картой или наличными в кассу"
- id: shipping_after_payment
  topic: delivery
  facts:
    - "сборка {cond:delivery.assembly_days} дня; в декабре на складе по 30–40 накладных в день"
    - "пробный или основной заказ лучше делать до декабря"
- id: shipping_individual_docs
  topic: delivery
  facts:
    - "для отправки ТК на физлицо нужны ФИО, телефон и паспортные данные получателя — их запрашивает менеджер при оформлении, не в чате"
    - "на ИП/ООО — реквизиты"
  must_not: ["запрашивать паспортные данные в чате"]

# ---------- Оплата и документы ----------
- id: payment_methods
  topic: payment
  facts:
    - "оплата: безнал по счёту для ИП/ООО, карта или наличные в кассу на складе; физлицу — перевод по счёту или карте"
- id: prepayment
  topic: payment
  facts:
    - "по умолчанию предоплата, отгружаем после оплаты"
    - "возможна частичная: внесли часть — поставили на резерв, остаток до отгрузки"
- id: payment_on_receipt
  topic: payment
  facts:
    - "на складе — да: приехали, проверили, оплатили, забрали"
    - "при отправке ТК — предоплата"
- id: prepayment_fear
  topic: payment
  facts:
    - "понимаем опасение; варианты: договор поставки и счёт с реквизитами компании; можно приехать или прислать знакомого в Москве — оплатит на складе при получении; можно начать с небольшого пробного заказа"
    - "склад и шоурум открыты, адрес ВДНХ, проспект Мира, 186"
  must_not: ["называть количество лет на рынке — факта нет"]
  bridge_hint: "предложить договор и реквизиты; спросить почту"
- id: deferred_payment
  topic: payment
  facts:
    - "новым клиентам отсрочки нет — работаем по предоплате"
    - "с постоянными клиентами с историей отсрочку обсуждает руководитель — агент передаёт вопрос"
  must_not: ["обещать отсрочку или сроки отсрочки"]
  escalate_if_insists: true
- id: consignment
  topic: payment
  facts:
    - "на реализацию с новыми клиентами не работаем"
    - "для магазинов с опытом — вопрос к руководителю, агент передаёт"
  must_not: ["обещать реализацию"]
  escalate_if_insists: true
- id: returns
  topic: payment
  facts:
    - "возврат непроданного не делаем — с возвратом не работаем"
    - "вместо этого не привязываем к объёму: возьмите меньше на пробу, дозаказывайте хоть на 10 тысяч со своей скидкой — остатков не будет"
  must_not: ["обещать возврат или обмен остатков"]
- id: documents
  topic: payment
  facts:
    - "ИП/ООО — договор поставки, счёт, УПД, сертификаты на каждую позицию"
    - "физлицу — накладная, чек и сертификаты"
- id: contract
  topic: payment
  facts:
    - "для ИП/ООО — стандартный договор поставки, высылаем вместе со счётом; физлицу — по желанию"
    - "можно оплатить с другой организации — пришлите реквизиты, перевыставим счёт"
- id: defect_claim
  topic: payment
  facts:
    - "если попался брак — фото/видео и название позиции; претензия в конфликтную комиссию производителя, деньги вернут или заменят"
    - "брак редкий"
  escalate_if_insists: true
- id: quality
  topic: payment
  facts:
    - "бренды сертифицированные, храним на сухом складе"
    - "брак встречается редко; если попался — фото/видео, претензия, возврат денег"

# ---------- Сертификаты, лицензии, пожарка, маркировка ----------
- id: license_not_needed
  topic: compliance
  facts:
    - "лицензия не нужна: бытовая пиротехника 1–3 класса опасности продаётся без лицензии"
    - "лицензия нужна только на профессиональную 4–5 класса, её рознице не предлагаем"
- id: permission_not_needed
  topic: compliance
  facts:
    - "специального разрешения на торговлю бытовой пиротехникой нет; нужно соблюдать требования пожарной безопасности к помещению"
    - "если придут с проверкой — звоните, подскажем и поможем документами"
  must_not: ["давать юридические советы, как обойти проверку"]
- id: okved
  topic: compliance
  facts:
    - "формально нужен ОКВЭД на торговлю пиротехникой, штраф небольшой — порядка 500 руб."
    - "реально проверяют пожарную безопасность и сертификаты"
- id: certificates
  topic: compliance
  facts:
    - "сертификаты соответствия ЕАЭС на каждое наименование, с живой печатью, кладём с заказом"
    - "сертификация уже пройдена под российский рынок — клиенту ничего получать не надо"
- id: premises_requirements
  topic: compliance
  facts:
    - "лучший вариант — отдельно стоящий павильон или бытовка/вагончик"
    - "в ТЦ — только последний этаж; в жилом доме — только 1 класс"
    - "нужны огнетушитель, датчики, закрытая витрина без доступа покупателя к товару"
  bridge_hint: "спросить формат точки / этаж"
- id: residential_building
  topic: compliance
  facts:
    - "в жилом доме (цоколь, первый этаж) — только 1 класс: бенгальские, хлопушки, фонтаны, дым; батареи нельзя"
    - "вариант: витрина-меню с видео, товар хранить рядом (гараж, машина) и выдавать"
- id: shopping_mall
  topic: compliance
  facts:
    - "в ТЦ разрешают только последний этаж"
    - "если ещё согласовываете с администрацией — руководитель с розничным опытом может проконсультировать по фото и плану помещения"
  escalate_if_insists: true
- id: marking_status
  topic: compliance
  facts:
    - "в этом сезоне обязательной маркировки нет — эксперимент перенесён, по текущей информации на 2027 год"
    - "товар, ввезённый до введения маркировки, продаётся без марки до конца срока годности"
    - "можем прислать ссылку на документ"
  must_not: ["спорить, если клиент не верит — предложить документ"]
- id: marking_leftovers
  topic: compliance
  facts:
    - "остатки маркировать не надо: всё купленное до введения — амнистия до конца срока годности"
    - "маркировать планируют только 3 класс (салюты), мелочь не трогают"
- id: marking_price_effect
  topic: compliance
  facts:
    - "после введения маркировки пиротехника подорожает на 25–30%: марку клеят в России на таможенных складах, логистика фуры дорожает примерно на 500 тыс."
    - "сейчас выгодно закупиться по старым ценам и без марки"
- id: shelf_life
  topic: compliance
  facts:
    - "свежие поставки — до 2028–2032; Zerga — до 2030–2032"
    - "просрочку не отгружаем; если нужен конкретный срок — подберём позиции"
- id: fresh_or_old
  topic: compliance
  facts:
    - "в прайсе и новые поставки, и часть прошлогодних; сроки у всех актуальные, 4–6 лет запаса"
    - "по запросу укажем год поставки по позициям"

# ---------- Подборка, советы ----------
- id: free_selection
  topic: advice
  facts:
    - "подборку делаем бесплатно: нужен бюджет, формат точки и город"
    - "состав: 60–70% батареи 16–49 залпов, петарды, бенгальские, фонтаны, несколько крупных для витрины"
    - "в наших интересах, чтобы клиент отторговался и вернулся"
  must_not: ["навязывать подборку опытному клиенту"]
  bridge_hint: "спросить бюджет вилкой или формат точки"
- id: bestsellers
  topic: advice
  facts:
    - "лучше всего идут батареи 16–49 залпов, петарды Корсар 2–4, Демон/Халк, бенгальские, фонтаны"
    - "несколько крупных соток и вееров — для витрины"
- id: first_year_advice
  topic: advice
  facts:
    - "первый год пристрельный: кто-то на 2,5 млн пишет, что не хватило, кто-то на 50 тыс. половину не продал"
    - "не перенабирать; 80% продаж — последняя неделя декабря"
    - "новичку проще отталкиваться от площади витрины: прислать фото или размеры — соберём под неё"
- id: leftovers_strategy
  topic: advice
  facts:
    - "с остатками — добрать только то, чего нет: петарды, бенгальские, пара новинок, на любую сумму"
    - "остатки подорожают вместе с рынком — продадутся дороже"
- id: no_money_options
  topic: advice
  facts:
    - "можно взять небольшой объём на пробу, предоплату частями, поставить на резерв"
    - "прайс пусть висит на почте — когда появится возможность, напишите, обновим цены"
  must_not: ["спорить о рынке", "давить"]
- id: for_self_terms
  topic: advice
  facts:
    - "для себя тоже отгружаем по оптовому прайсу, если сумма от {cond:min_order_rub}; меньше — шоурум на ВДНХ, там розница"
    - "скидка та же, что опту — от суммы; физлицо на цену не влияет"
  must_not: ["спрашивать про торговую точку, опыт, поставщика"]
- id: wedding_advance
  topic: advice
  facts:
    - "заранее — правильно: цены растут, сроки годности до 2030–2032"
    - "подберём салюты, фонтаны, бенгальские; заказ можно поставить на резерв"

# ---------- Конкуренты и возражения ----------
- id: two_suppliers
  topic: objections
  facts:
    - "лучше два поставщика, чем один — особенно в год дефицита"
    - "от своего уходить не надо: взять у нас то, чего у него нет — Zerga, петарды Волк, Премьер Салют"
    - "сравнить по итоговой цене"
  bridge_hint: "спросить, какие бренды и на каких условиях берёт сейчас"
- id: local_supplier
  topic: objections
  facts:
    - "местного оставить на срочный дозаказ"
    - "у нас шире ассортимент и ниже базовые цены — основной объём заранее у нас, добирать у местного"
- id: already_ordered
  topic: objections
  facts:
    - "взять немного на знакомство — 1–2 коробки Zerga или петард; к объёму не привязываем, скидку сразу под потенциальный объём"
    - "посмотреть, как уйдёт — к следующему сезону будет ясно"
- id: marketplaces
  topic: objections
  facts:
    - "к сезону цены на маркетплейсах взлетают, и там нет сертификатов с печатью для точки"
    - "по Zerga блокируем карточки ниже рекомендованной цены — розницу не перебьют"
- id: joint_purchases
  topic: objections
  facts:
    - "совместные покупки ушли из-за маркетплейсов, но оптовая цена у нас ниже розницы маркетплейсов, а в сезон они дорожают"
    - "для себя на большую компанию — прайс, минималка от {cond:min_order_rub}"
- id: container_import
  topic: objections
  facts:
    - "для одной точки контейнер — много; плюс обязательная сертификация ЕАЭС и растаможка, без сертификата товар заберут на первой проверке"
    - "первый год лучше проверить спрос на готовом ассортименте"
  escalate_if_insists: true
- id: prices_only_response
  topic: objections
  facts:
    - "без презентаций: скидка по сетке под сумму, предоплата, отгрузка 1–2 дня, доставка КИТом, прайс отправляем сразу"
  must_not: ["презентовать компанию", "задавать вопросы про точку и опыт"]
  bridge_hint: "спросить только сумму один раз, почту, мессенджер"
- id: duplicate_lead
  topic: objections
  facts:
    - "если прайс уже отправляли — повторно не шлём; уточняем, кто из коллег ведёт, и спрашиваем обратную связь по прайсу"
    - "два менеджера по одной заявке — наша ошибка, извиняемся коротко"
  must_not: ["отправлять прайс повторно"]
