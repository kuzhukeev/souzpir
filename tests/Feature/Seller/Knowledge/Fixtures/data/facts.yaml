# База фактов. Агент получает 1–3 записи и формулирует ответ СВОИМИ СЛОВАМИ.
# facts — атомарные утверждения; must_not — чего нельзя говорить в этой теме;
# bridge_hint — куда вести разговор после ответа. Цифры условий — только из conditions.yaml (ссылка {cond:...}).
# Источник — файлы аудита 01–05. Формулировки-примеры — черновик к согласованию с руководителем ОП.

# ---------- Компания ----------
- id: company_location
  topic: company
  facts:
