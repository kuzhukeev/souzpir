    - "клиенты, пробовавшие ноунейм, обычно возвращались недовольными — разница как между Мерседесом и Жигулями"
- id: year_round
  topic: company
  facts:
    - "работаем круглый год: летом свадьбы, выпускные, гендер-пати, охотники берут петарды"
