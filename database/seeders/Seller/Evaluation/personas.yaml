  name: "Новичок из Воронежа, павильон у рынка"
  type: newbie
  facts: { city: Воронеж, purpose: на продажу, experience: нет, outlet_type: павильон, categories: всё, budget: "тысяч 100", timing: "к ноябрю", email: ivan.pav@mail.ru, messenger: WhatsApp }
