# This is an isolated, opt-in access-log format, not an OSPanel override.
# Load mod_setenvif and mod_log_config. Configure exactly one CustomLog for
# each access-log destination using the format below; do not keep a second
# combined/%r log for the same requests. Error logs are outside this format.
#
# Log a path only after explicitly recognising plain ASCII and excluding every
# reset-password path. Encoded paths, ambiguous paths and unparsed requests
# default to "-". Query strings and Referer are never logged, including for
# ordinary paths. The remaining method/status/size/client/time fields remain.
SetEnvIfExpr "-n %{THE_REQUEST}" !souzpir_safe_access_uri
SetEnvIfExpr "%{THE_REQUEST} =~ m#^[A-Z]+ (/[-A-Za-z0-9._/]*)(?:[?][^ ]*)? HTTP/[0-9]+[.][0-9]+$#" souzpir_safe_access_uri=$1
SetEnvIfExpr "%{THE_REQUEST} =~ m#(?i)reset-password#" !souzpir_safe_access_uri
LogFormat "%h %t \"%m %{souzpir_safe_access_uri}e %H\" %>s %b" souzpir_password_safe_access
