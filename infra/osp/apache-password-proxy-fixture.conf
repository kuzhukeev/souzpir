# Isolated loopback fixture only; E101G_APACHE_DIR must be an absolute private directory.
ServerRoot "C:/OSPanel/modules/Apache"
ServerName 127.0.0.1
Listen 127.0.0.1:8242
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
PidFile "${E101G_APACHE_DIR}/httpd.pid"
ErrorLog "${E101G_APACHE_DIR}/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "${E101G_APACHE_DIR}/access.log" combined
ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders Off
ProxyPass /__proxy_error http://127.0.0.1:9/
ProxyPass / http://127.0.0.1:8241/
ProxyPassReverse / http://127.0.0.1:8241/
