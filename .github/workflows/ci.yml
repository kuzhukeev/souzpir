name: CI

on:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '0 1 * * *'   # ночной прогон race-тестов (04:00 МСК)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_INSTANCE: ci
  APP_URL: http://127.0.0.1:8101
  CABINET_ORGANIZATION_ID: 01J00000000000000000000000
  APP_PREVIEW_DATABASE: souzpir_ci_preview
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: souzpir_test_ci
  DB_TEST_DATABASE: souzpir_test_ci
  DB_USERNAME: souzpir_ci
  DB_PASSWORD: ci-only-password
  CACHE_PREFIX: 'ci:'
  REDIS_PREFIX: 'ci:'
  SESSION_COOKIE: souzpir_ci_session
  QUEUE_NAMESPACE: ci
  QUEUE_CONNECTION: sync
  AI_DRIVER: fake
  DELIVERY_DRIVER: fake
  MAIL_MAILER: log
  FEATURES_SCHEDULING_ENABLED: 'false'

jobs:
  php-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - run: composer lint

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  php-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - run: bash scripts/ci/postgres.sh
      - uses: ramsey/composer-install@v3
      - run: php artisan test --parallel --processes=4 --exclude-group=race

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: bash scripts/ci/postgres.sh
      - uses: ramsey/composer-install@v3
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci/browser-smoke.sh
      - name: Browser failure diagnostics
        if: failure()
        run: |
          for logfile in .local/runtime/*.log .local/runtime/testing/storage/logs/laravel.log; do
            if [ -f "$logfile" ]; then echo "== $logfile"; tail -n 80 "$logfile"; fi
          done

  race:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - run: bash scripts/ci/postgres.sh
      - uses: ramsey/composer-install@v3
      - run: php artisan test --group=race
