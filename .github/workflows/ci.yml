name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: souzpir_test_ci
          POSTGRES_USER: souzpir_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U souzpir_ci -d souzpir_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_INSTANCE: ci
      APP_URL: http://127.0.0.1:8101
      CABINET_ORGANIZATION_ID: 01J00000000000000000000000
      APP_PREVIEW_DATABASE: souzpir_ci_preview
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: souzpir_test_ci
      DB_TEST_DATABASE: souzpir_test_ci
      DB_USERNAME: souzpir_ci
      DB_PASSWORD: ci-only-password
      CACHE_PREFIX: 'ci:'
      REDIS_PREFIX: 'ci:'
      SESSION_COOKIE: souzpir_ci_session
      QUEUE_NAMESPACE: ci
      QUEUE_CONNECTION: sync
      AI_DRIVER: fake
      DELIVERY_DRIVER: fake
      MAIL_MAILER: log
      FEATURES_SCHEDULING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare local runtime
        run: |
          mkdir -p .local/tmp
          cp .env.example .env.testing
          php -r 'file_put_contents(".env.testing", "\nAPP_KEY=base64:".base64_encode(random_bytes(32))."\n", FILE_APPEND);'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          php artisan serve --env=testing --no-reload --host=127.0.0.1 --port=8101 > .local/runtime/browser-server.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:8101/up && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8101/up > /dev/null
          npx vite build --config vite.layout.config.ts
          npx vite build --config tests/Browser/E1-02/vite.config.ts
          php -S 127.0.0.1:5183 -t .local/runtime/layout-fixture > .local/runtime/layout-vite.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:5183/tests/Browser/Layout/fixture.html > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:5183/tests/Browser/Layout/fixture.html > /dev/null
          curl --fail --silent http://127.0.0.1:5183/tests/Browser/E1-02/ui-fixture.html > /dev/null
          E102_FIXTURE_ENABLED=1 E102_FIXTURE_ORG=01J00000000000000000000002 \
            CABINET_ORGANIZATION_ID=01J00000000000000000000002 php tests/Browser/E1-02/prepare-fixture.php
          CABINET_ORGANIZATION_ID=01J00000000000000000000002 APP_URL=http://127.0.0.1:8102 \
            APP_INSTANCE=ci-e102 SESSION_COOKIE=ci_e102_session \
            php artisan serve --env=testing --no-reload --host=127.0.0.1 --port=8102 > .local/runtime/onboarding-server.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:8102/up && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8102/up > /dev/null
          RUN_ONBOARDING_E2E=1 npm run test:browser
      - name: Browser failure diagnostics
        if: failure()
        run: |
          for logfile in .local/runtime/browser-server.log .local/runtime/onboarding-server.log .local/runtime/layout-vite.log .local/runtime/testing/storage/logs/laravel.log; do
            if [ -f "$logfile" ]; then tail -n 80 "$logfile"; fi
          done
