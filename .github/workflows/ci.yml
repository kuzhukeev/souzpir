name: CI

on:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '0 1 * * *'   # полный ночной прогон (04:00 МСК)
  workflow_dispatch:
    inputs:
      acceptance_e901e:
        description: 'Проверить настройки напоминаний и создание диалога'
        required: false
        type: boolean
        default: false
      acceptance_e901c:
        description: 'Запустить проверку контекста брендов и fake-напоминаний'
        required: false
        type: boolean
        default: false
      acceptance_e901b:
        description: 'Запустить сквозной тест замера и публикации'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_INSTANCE: ci
  APP_URL: http://127.0.0.1:8101
  CABINET_ORGANIZATION_ID: 01J00000000000000000000000
  APP_PREVIEW_DATABASE: souzpir_ci_preview
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: souzpir_test_ci
  DB_TEST_DATABASE: souzpir_test_ci
  DB_USERNAME: souzpir_ci
  DB_PASSWORD: ci-only-password
  CACHE_PREFIX: 'ci:'
  REDIS_PREFIX: 'ci:'
  SESSION_COOKIE: souzpir_ci_session
  QUEUE_NAMESPACE: ci
  QUEUE_CONNECTION: sync
  AI_DRIVER: fake
  DELIVERY_DRIVER: fake
  MAIL_MAILER: log
  FEATURES_SCHEDULING_ENABLED: 'false'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - run: python3 scripts/ci/check-test-suite-coverage.py
      - run: mkdir -p .local/tmp
      - run: composer lint

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  php-tests:
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: souzpir_parallel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [ShellCore, CoreTurnsA, CoreTurnsB, CoreTurnsC, Product]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - run: bash scripts/ci/postgres.sh
      - name: Prepare nonprivileged parallel test databases
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE souzpir_parallel LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "GRANT CONNECT ON DATABASE souzpir_test_ci TO souzpir_parallel;"
          for worker in 1 2 3 4; do
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE souzpir_test_ci_test_$worker OWNER souzpir_parallel;"
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "REVOKE CONNECT ON DATABASE souzpir_test_ci_test_$worker FROM PUBLIC;"
          done
      - uses: ramsey/composer-install@v3
      - name: Run PHP tests
        run: |
          suite="${{ matrix.suite }}"
          if [[ "$suite" == CoreTurnsA || "$suite" == CoreTurnsB || "$suite" == CoreTurnsC ]]; then
            filter="$(php -r '
              $source = file_get_contents("tests/Feature/ProtectedOperations/FirstTurnStateTest.php");
              preg_match_all("/public function (test_[A-Za-z0-9_]+)\\s*\\(/", $source, $matches);
              $target = match ($argv[1]) { "CoreTurnsA" => 0, "CoreTurnsB" => 1, "CoreTurnsC" => 2 };
              $selected = array_values(array_filter($matches[1], static fn (string $name): bool => crc32("460:".$name) % 3 === $target));
              if ($selected === []) { fwrite(STDERR, "Empty CoreTurns shard\n"); exit(1); }
              echo "/(?:".implode("|", $selected).")(?:$|\\s)/";
            ' "$suite")"
            php artisan test --parallel --without-databases --processes=4 --exclude-group=race --testsuite=CoreTurns --filter="$filter"
          else
            php artisan test --parallel --without-databases --processes=4 --exclude-group=race --testsuite="$suite"
          fi

  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - run: bash scripts/ci/postgres.sh
      - uses: ramsey/composer-install@v3
      - name: Check recorded fixtures and available policy replay
        run: vendor/bin/phpunit --testsuite=Equivalence --no-coverage

      - name: Check recorded adapter rejection in runtime
        run: vendor/bin/phpunit tests/Equivalence/RuntimeReplayE307ETest.php --no-coverage

  browser-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Check dashboard and profile in Chromium
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          npx playwright test tests/Browser/E7-06E/summary.spec.ts tests/Browser/E8-14M/hints.spec.ts --workers=1

  browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      BROWSER_SHARD: '${{ matrix.shard }}/4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: bash scripts/ci/postgres.sh
      - uses: ramsey/composer-install@v3
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci/browser-smoke.sh
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: .local/runtime/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser failure diagnostics
        if: failure()
        run: |
          for logfile in .local/runtime/*.log .local/runtime/testing/storage/logs/laravel.log; do
            if [ -f "$logfile" ]; then echo "== $logfile"; tail -n 80 "$logfile"; fi
          done

  acceptance-vision:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_e901b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ACCEPTANCE_E901B: '1'
      DB_DATABASE: souzpir_test_e901b
      DB_TEST_DATABASE: souzpir_test_e901b
      DB_USERNAME: souzpir_e901b
      APP_PREVIEW_DATABASE: souzpir_preview_e901b
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: bash scripts/ci/postgres.sh
      - name: Prepare isolated acceptance database
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE souzpir_e901b LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE souzpir_test_e901b OWNER souzpir_e901b;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "REVOKE CONNECT ON DATABASE souzpir_test_e901b FROM PUBLIC;"
      - uses: ramsey/composer-install@v3
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/Browser/Acceptance/vision-e901b.spec.ts --workers=1

  acceptance-context:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_e901c
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ACCEPTANCE_E901C: '1'
      DB_DATABASE: souzpir_test_e901c
      DB_TEST_DATABASE: souzpir_test_e901c
      DB_USERNAME: souzpir_e901c
      APP_PREVIEW_DATABASE: souzpir_preview_e901c
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: bash scripts/ci/postgres.sh
      - name: Prepare isolated acceptance database
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE souzpir_e901c LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE souzpir_test_e901c OWNER souzpir_e901c;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "REVOKE CONNECT ON DATABASE souzpir_test_e901c FROM PUBLIC;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE souzpir_e901d LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE souzpir_test_e901d OWNER souzpir_e901d;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "REVOKE CONNECT ON DATABASE souzpir_test_e901d FROM PUBLIC;"
      - uses: ramsey/composer-install@v3
      - name: Check two fake followups and stop
        env:
          DB_DATABASE: souzpir_test_e901d
          DB_TEST_DATABASE: souzpir_test_e901d
          DB_USERNAME: souzpir_e901d
          APP_PREVIEW_DATABASE: souzpir_preview_e901d
        run: |
          vendor/bin/phpunit tests/Browser/Acceptance/FollowupsE901DTest.php --no-coverage
          vendor/bin/phpunit tests/Browser/Acceptance/TelegramE901DTest.php --no-coverage
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/Browser/Acceptance/context-e901c.spec.ts --workers=1

  acceptance-followups-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_e901e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ACCEPTANCE_E901E: '1'
      DB_DATABASE: souzpir_test_e901e
      DB_TEST_DATABASE: souzpir_test_e901e
      DB_USERNAME: souzpir_e901e
      APP_PREVIEW_DATABASE: souzpir_preview_e901e
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: bash scripts/ci/postgres.sh
      - name: Prepare isolated acceptance database
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE souzpir_e901e LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE souzpir_test_e901e OWNER souzpir_e901e;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "REVOKE CONNECT ON DATABASE souzpir_test_e901e FROM PUBLIC;"
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit tests/Browser/Acceptance/KnowledgeLifecycleE901ETest.php --no-coverage
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/Browser/Acceptance/followups-e901e.spec.ts --workers=1

  race:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: souzpir_parallel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - run: bash scripts/ci/postgres.sh
      - name: Prepare nonprivileged parallel test databases
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE souzpir_parallel LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "GRANT CONNECT ON DATABASE souzpir_test_ci TO souzpir_parallel;"
          for worker in 1 2 3 4; do
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE souzpir_test_ci_test_$worker OWNER souzpir_parallel;"
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "REVOKE CONNECT ON DATABASE souzpir_test_ci_test_$worker FROM PUBLIC;"
          done
      - uses: ramsey/composer-install@v3
      - name: Run race tests in dedicated database
        env:
          DB_DATABASE: souzpir_test_ci_test_1
          DB_TEST_DATABASE: souzpir_test_ci_test_1
        run: php artisan test --group=race
