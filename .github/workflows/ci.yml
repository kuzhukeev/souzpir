name: CI

on:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '0 1 * * *'   # ночной прогон race-тестов (04:00 МСК)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_INSTANCE: ci
  APP_URL: http://127.0.0.1:8101
  CABINET_ORGANIZATION_ID: 01J00000000000000000000000
  APP_PREVIEW_DATABASE: souzpir_ci_preview
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: souzpir_test_ci
  DB_TEST_DATABASE: souzpir_test_ci
  DB_USERNAME: souzpir_ci
  DB_PASSWORD: ci-only-password
  CACHE_PREFIX: 'ci:'
  REDIS_PREFIX: 'ci:'
  SESSION_COOKIE: souzpir_ci_session
  QUEUE_NAMESPACE: ci
  QUEUE_CONNECTION: sync
  AI_DRIVER: fake
  DELIVERY_DRIVER: fake
  MAIL_MAILER: log
  FEATURES_SCHEDULING_ENABLED: 'false'

jobs:
  php-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - run: python3 scripts/ci/check-test-suite-coverage.py
      - run: mkdir -p .local/tmp
      - run: composer lint

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  php-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: souzpir_parallel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [Core, CoreTurnsA, CoreTurnsB, Shell, Product]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - run: bash scripts/ci/postgres.sh
      - name: Prepare nonprivileged parallel test databases
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE souzpir_parallel LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "GRANT CONNECT ON DATABASE souzpir_test_ci TO souzpir_parallel;"
          for worker in 1 2 3 4; do
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE souzpir_test_ci_test_$worker OWNER souzpir_parallel;"
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "REVOKE CONNECT ON DATABASE souzpir_test_ci_test_$worker FROM PUBLIC;"
          done
      - uses: ramsey/composer-install@v3
      - name: Run PHP tests
        run: |
          suite="${{ matrix.suite }}"
          if [[ "$suite" == CoreTurnsA || "$suite" == CoreTurnsB ]]; then
            filter="$(php -r '
              $source = file_get_contents("tests/Feature/ProtectedOperations/FirstTurnStateTest.php");
              preg_match_all("/public function (test_[A-Za-z0-9_]+)\\s*\\(/", $source, $matches);
              $target = $argv[1] === "CoreTurnsA" ? 0 : 1;
              $selected = array_values(array_filter($matches[1], static fn (string $name): bool => crc32("199:".$name) % 2 === $target));
              if ($selected === []) { fwrite(STDERR, "Empty CoreTurns shard\n"); exit(1); }
              echo "/(?:".implode("|", $selected).")(?:$|\\s)/";
            ' "$suite")"
            php artisan test --parallel --without-databases --processes=4 --exclude-group=race --testsuite=CoreTurns --filter="$filter"
          else
            php artisan test --parallel --without-databases --processes=4 --exclude-group=race --testsuite="$suite"
          fi

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BROWSER_SHARD: '${{ matrix.shard }}/3'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: bash scripts/ci/postgres.sh
      - uses: ramsey/composer-install@v3
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci/browser-smoke.sh
      - name: Browser failure diagnostics
        if: failure()
        run: |
          for logfile in .local/runtime/*.log .local/runtime/testing/storage/logs/laravel.log; do
            if [ -f "$logfile" ]; then echo "== $logfile"; tail -n 80 "$logfile"; fi
          done

  race:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, pgsql, mbstring, intl, bcmath, gd', coverage: none }
      - run: bash scripts/ci/postgres.sh
      - uses: ramsey/composer-install@v3
      - run: php artisan test --group=race
